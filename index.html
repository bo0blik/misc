<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JS Object Editor v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#0a1d28;
  --surface:#0c2230;
  --surface-2:#0e2736;
  --surface-3:#102b3a;
  --border:#163544;
  --border-hi:#244655;
  --text:#c9d0d4;
  --muted:#7f929c;
  --blue:#58b8ed;
  --blue-dim:#2b7fa9;
  --green:#9bd36c;
  --pink:#ed4d9f;
  --orange:#f0a860;
  --violet:#b98cf0;
  --shadow:0 12px 30px rgba(0,0,0,.42);
  --col-type:58px;
  --col-name:130px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  font:14px/1.2 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;padding:40px 20px
}
button,input{font:inherit}
button{border:0;outline:0}
button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.app{
  width:100%;max-width:640px;align-self:flex-start;
  border:1px solid #1c4258;border-radius:14px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.03) inset
}
.topbar{
  height:46px;background:#0d2230;border-bottom:1px solid #112d3c;
  display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px
}
.topbar-title{color:#eef2f4;font-size:15px;font-weight:600;letter-spacing:.01em}
.icon-btn{
  width:32px;height:32px;background:transparent;color:var(--blue);border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer
}
.icon-btn:hover{background:#102c3b}
.icon-btn .icon{transition:transform .25s cubic-bezier(.4,0,.2,1)}
.icon-btn.all-open .icon{transform:rotate(180deg)}
.icon{width:15px;height:15px;display:block}

/* ---- table grid shared by section headers, rows and child rows ---- */
.section-title,.row,.child-row{
  display:grid;
  grid-template-columns:var(--col-type) var(--col-name) 1fr;
  align-items:stretch;
  min-height:40px;
  position:relative;
  box-shadow:0 1px 0 #1c4258;
  transition:filter .1s ease
}
/* one mechanism for "whole row highlights on hover" at every nesting level:
   brighten everything painted inside the row as a single layer, so it doesn't
   matter that the type/name cells have their own opaque backgrounds - no need
   to special-case each cell or each level with a different hover color. */
.section-title:hover,.row:hover,.child-row:hover{filter:brightness(1.16)}

.section{position:relative;margin:0}
.section-title{
  height:44px;min-height:44px;
  color:#eef2f4;font-size:16px;font-weight:600;user-select:none;
  background:#0d2536;
  box-shadow:inset 0 -1px 0 #1c4258
}
.section:first-child .section-title{box-shadow:inset 0 1px 0 #1c4258, inset 0 -1px 0 #1c4258}
.section:first-child .section-title .section-icon{border-top:1px solid #1c4258}
.section-title .title-text{background:transparent;border-right-color:#1c4258}
.section-title .section-icon{background:#123a52;border-bottom:1px solid #1c4258}

/* top-level rows (section headers + flat top-level fields) get a horizontal divider to stand out,
   styled to match .section-title so it reads as the same top-level tier, not nested content */
.section-flat .row{
  height:44px;min-height:44px;
  background:#0d2536;
  box-shadow:inset 0 -1px 0 #1c4258
}
.section:first-child.section-flat .row{box-shadow:inset 0 1px 0 #1c4258, inset 0 -1px 0 #1c4258}
.section:first-child.section-flat .type-menu-btn{border-top:1px solid #1c4258}
.section-flat .key{background:transparent;font-weight:600;color:#eef2f4;font-size:16px;border-right-color:#1c4258}
.section-flat .type-menu-btn{background:#123a52;border-bottom:1px solid #1c4258}

/* nested-panel look: content that belongs to the section above it.
   Collapses/expands with a smooth grid-rows slide instead of display:none,
   so opening a section feels like a real animation, not a hard cut. */
.section-body{
  display:grid;grid-template-rows:1fr;
  transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1);
  position:relative
}
.section.collapsed .section-body{
  grid-template-rows:0fr;
  transition-timing-function:cubic-bezier(.4,0,1,1);
  transition-duration:.2s
}
.section-body-inner{
  min-height:0;overflow:hidden;
  background:#081620;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.35);
  transition:opacity .18s ease
}
.section.collapsed .section-body-inner{opacity:0}
.section-body-inner::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--blue-dim);pointer-events:none
}
.section-body .row{background:transparent}
.section-flat .section-body-inner{background:transparent;box-shadow:none}
.section-flat .section-body-inner::before{display:none}

/* column 1 - type */
.section-icon,.type-menu-btn{
  grid-column:1;width:100%;height:100%;background:#0d2635;color:var(--blue);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border-right:1px solid #1c4258
}
.type-menu-btn.active{background:#123244}

/* column 2 - name */
.title-text,.key{
  grid-column:2;display:flex;align-items:center;
  padding-left:10px;color:#c6cdd1;font-size:16px;font-weight:500;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  background:#0b1f2b;border-right:1px solid #1c4258
}
.key{cursor:pointer}
.title-text{cursor:pointer}

/* column 3 - value / expand */
.value-cell{
  grid-column:3;display:flex;align-items:center;gap:8px;
  padding:0 10px;min-width:0
}
.section-expand{
  flex:1;min-width:0;align-self:stretch;order:-1;
  margin:0 -10px;width:calc(100% + 20px);height:auto;
  display:flex;align-items:center;justify-content:flex-start;padding:0 12px;
  color:var(--blue);background:transparent;cursor:pointer
}
.section-expand .chevron{transform:rotate(225deg) translate(-1.5px,-1.5px);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.section.collapsed .section-expand .chevron{transform:rotate(45deg) translate(-1.5px,-1.5px)}

.value{
  flex:1;min-width:0;align-self:stretch;
  margin:0 -10px;width:calc(100% + 20px);height:auto;
  padding:0 12px;border:0;border-radius:0;
  background:transparent;color:#c8d1d5;outline:0;font-size:16px;
  color-scheme:dark
}
.value:focus{background:#0d2536;box-shadow:inset 0 0 0 1px var(--blue)}
.value[readonly]{color:#8fa6b3;-webkit-text-fill-color:#8fa6b3;cursor:default}
.value[readonly]:focus{background:transparent;box-shadow:none}
.value[type="number"]{-moz-appearance:textfield;appearance:textfield;font-variant-numeric:tabular-nums}
.value[type="number"]::-webkit-inner-spin-button,
.value[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* compact modern up/down stepper for number fields, replacing the native browser spinner */
.value-cell.numeric{align-items:stretch;padding-left:10px;padding-right:0;position:relative}
.value-cell.numeric .value{margin:0;width:auto;padding:0 8px}
.value-cell.numeric .value:focus{background:transparent;box-shadow:none}
.value-cell.numeric:focus-within{background:#0d2536;box-shadow:inset 0 0 0 1px var(--blue)}
.stepper{
  flex:0 0 24px;display:flex;flex-direction:column;
  border-left:1px solid #1c4258
}
.stepper button{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--blue);background:transparent;cursor:pointer;transition:background .1s ease
}
.stepper button:hover{background:#123244}
.stepper .step-up{border-bottom:1px solid #1c4258}
.step-icon{width:6px;height:6px;border-left:1.3px solid currentColor;border-top:1.3px solid currentColor}
.step-up .step-icon{transform:rotate(45deg) translate(.5px,.5px)}
.step-down .step-icon{transform:rotate(225deg) translate(.5px,.5px)}
.xml{
  flex:1;align-self:stretch;margin:0 -10px;width:calc(100% + 20px);
  border:0;border-radius:0;
  background:transparent;padding:0 12px;display:flex;align-items:center;
  white-space:nowrap;overflow:hidden;font:13px/1.3 'JetBrains Mono',Consolas,Monaco,monospace;min-width:0
}
.xml .tag{color:#d4d8db}.xml .attr{color:var(--green)}
.xml .str{color:#aaa9d9}.xml .pink{color:var(--pink)}
.bool-box{
  width:18px;height:18px;border:1px solid #294653;
  border-radius:4px;background:#091a24;cursor:pointer;position:relative
}
.bool-box.checked:after{
  content:"✓";position:absolute;left:2px;top:-2px;color:#cbd5d9;font-size:16px
}
.expand-btn{
  width:40px;height:40px;order:-1;flex:0 0 40px;
  display:flex;align-items:center;justify-content:center;
  color:var(--blue);background:transparent;cursor:pointer
}
.value-cell > .expand-btn:only-child{
  flex:1;min-width:0;align-self:stretch;
  margin:0 -10px;width:calc(100% + 20px);height:auto;
  justify-content:flex-start;padding:0 12px
}
.chevron{
  width:9px;height:9px;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-1.5px,-1.5px);
  transition:transform .13s ease;
  position:relative;left:5px
}
.expanded .expand-btn .chevron{transform:rotate(225deg) translate(-1.5px,-1.5px)}

/* row that owns a nested block: once expanded, merge visually into the panel below it.
   Works for both top-level rows and deeper .child-row triggers, so nesting can go
   arbitrarily deep (.child-row can itself own another .children block). */
.expandable.expanded{box-shadow:none}
.expandable.expanded .type-menu-btn{border-bottom:0}
.expandable.expanded .key{border-bottom:0}

/* ---- nested block: a distinct "card" that slides open, clearly reads as a sub-level.
   It's a SIBLING of its trigger row (not a grid item inside it), so a collapsed
   block never steals height from the row above it.

   Each depth gets its own accent color (--accent) and background tint via a
   level modifier class (.l2 default green, .l3 pink, .l4 orange, .l5 violet),
   so it's visually obvious how deep a field is nested, not just that it's nested. */
.children{
  --accent:var(--green);
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .22s cubic-bezier(.4,0,1,1);
  position:relative;
  background:#050f16;
  overflow:hidden
}
.children.l3{--accent:var(--pink);background:#170b16}
.children.l4{--accent:var(--orange);background:#1b130a}
.children.l5{--accent:var(--violet);background:#120b1f}
.expandable.expanded + .children{
  grid-template-rows:1fr;
  transition-timing-function:cubic-bezier(.4,0,.2,1);
  transition-duration:.3s
}
.children-inner{
  min-height:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 60%);
  box-shadow:
    inset 3px 0 0 var(--accent),
    inset 0 1px 0 rgba(255,255,255,.05),
    inset 0 6px 14px rgba(0,0,0,.55),
    inset 0 -8px 16px rgba(0,0,0,.3)
}
.children .child-row{
  min-height:40px;
  box-shadow:0 1px 0 rgba(28,66,88,.5)
}
.children .child-row:last-child{box-shadow:none}
.children .key{background:transparent;color:#8fa6b3;font-weight:500;border-right-color:transparent}
.children .type-menu-btn{
  background:transparent;border-right-color:transparent;
  color:var(--accent);justify-content:center
}
.mini-badge{
  width:26px;height:26px;font-size:10px;
  display:flex;align-items:center;justify-content:center
}
.children .type-menu-btn .icon{width:14px;height:14px}
.children .expand-btn{color:var(--accent)}

.menu{
  position:fixed;z-index:1000;width:238px;background:#102b3a;
  border:1px solid #2a4a59;border-radius:5px;box-shadow:var(--shadow);
  padding:5px 0;display:none
}
.menu.open{display:block}
.menu-title{
  padding:8px 11px 7px;color:#718893;font-size:11px;text-transform:uppercase;
  letter-spacing:.08em
}
.menu-item{
  height:34px;width:100%;padding:0 10px;background:transparent;color:#c7d0d4;
  display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer
}
.menu-item:hover{background:#143546;color:#e0e7ea}
.menu-item .mi-icon{width:17px;height:17px;color:var(--blue);display:flex;align-items:center;justify-content:center}
.menu-item.danger{color:#df8d9c}
.menu-item.danger .mi-icon{color:#df7185}
.menu-sep{height:1px;background:#1b3b4a;margin:5px 0}
.submenu-arrow{margin-left:auto;color:#587480}
.type-menu{width:245px}
.type-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px 6px 7px
}
.type-option{
  height:32px;background:transparent;color:#c5ced2;border-radius:3px;
  display:flex;align-items:center;gap:8px;padding:0 7px;cursor:pointer
}
.type-option:hover{background:#143546}
.type-option .mi-icon{color:var(--blue);width:16px}
.hidden{display:none!important}
.status{
  position:fixed;right:12px;bottom:9px;color:#3e5966;font-size:11px;
  pointer-events:none
}
@media(max-width:850px){
  :root{--col-name:100px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="topbar-title">Пример объекта</span>
    <button class="icon-btn" id="toggleAllBtn" title="Развернуть/свернуть всё" aria-label="Развернуть/свернуть всё">
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
  </div>

  <section class="section collapsed">
    <div class="section-title">
      <button class="section-icon" data-section-menu="simple" title="Тип и меню раздела">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="2.3" y="2.3" width="11.4" height="11.4" rx="1"/>
          <path d="M2.6 6.2h10.8M6.2 2.6v10.8M10 2.6v10.8"/>
        </svg>
      </button>
      <span class="title-text">Simple</span>
      <div class="value-cell">
        <button class="section-expand" data-section-expand aria-label="Свернуть/развернуть"><span class="chevron"></span></button>
      </div>
    </div>
    <div class="section-body"><div class="section-body-inner">
      <div class="row" data-field="Null">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="8" cy="8" r="5.2"/><path d="M4 4l8 8"/>
          </svg>
        </button>
        <div class="key">Null</div>
        <div class="value-cell"></div>
      </div>
      <div class="row" data-field="True">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M3 13V3h7.2l2 2v4.2H3"/><path d="M5.2 5.2h4.4M5.2 7.5h4.4"/>
          </svg>
        </button>
        <div class="key">True</div>
        <div class="value-cell">
          <button class="bool-box" data-bool="trueValue" aria-label="toggle"></button>
        </div>
      </div>
      <div class="row" data-field="False">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M3 13V3h7.2l2 2v4.2H3"/><path d="M5.2 5.2h4.4M5.2 7.5h4.4"/>
          </svg>
        </button>
        <div class="key">False</div>
        <div class="value-cell">
          <button class="bool-box checked" data-bool="falseValue" aria-label="toggle"></button>
        </div>
      </div>
    </div></div>
  </section>

  <section class="section collapsed">
    <div class="section-title">
      <button class="section-icon" data-section-menu="numbers" title="Тип и меню раздела">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M2.5 4h11M2.5 8h11M2.5 12h11"/><circle cx="4" cy="4" r=".7" fill="currentColor"/><circle cx="4" cy="8" r=".7" fill="currentColor"/><circle cx="4" cy="12" r=".7" fill="currentColor"/>
        </svg>
      </button>
      <span class="title-text">Numbers</span>
      <div class="value-cell">
        <button class="section-expand" data-section-expand aria-label="Свернуть/развернуть"><span class="chevron"></span></button>
      </div>
    </div>
    <div class="section-body"><div class="section-body-inner">
      <div class="row" data-field="0">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">123</button>
        <div class="key">0</div>
        <div class="value-cell numeric">
          <input class="value" type="number" value="123" data-value="numbers.0">
          <div class="stepper">
            <button class="step-up" data-step="1" aria-label="Увеличить"><span class="step-icon"></span></button>
            <button class="step-down" data-step="-1" aria-label="Уменьшить"><span class="step-icon"></span></button>
          </div>
        </div>
      </div>
      <div class="row" data-field="1">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">123</button>
        <div class="key">1</div>
        <div class="value-cell numeric">
          <input class="value" type="number" value="12" data-value="numbers.1">
          <div class="stepper">
            <button class="step-up" data-step="1" aria-label="Увеличить"><span class="step-icon"></span></button>
            <button class="step-down" data-step="-1" aria-label="Уменьшить"><span class="step-icon"></span></button>
          </div>
        </div>
      </div>
    </div></div>
  </section>

  <section class="section section-flat">
    <div class="section-body"><div class="section-body-inner">
      <div class="row" data-field="Text">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">ABC</button>
        <div class="key">Text</div>
        <div class="value-cell">
          <input class="value" value="foo" data-value="text">
        </div>
      </div>
    </div></div>
  </section>

  <section class="section collapsed">
    <div class="section-title">
      <button class="section-icon" data-section-menu="objects" title="Тип и меню раздела">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="2.3" y="2.3" width="11.4" height="11.4" rx="1"/>
          <path d="M2.6 6.2h10.8M6.2 2.6v10.8M10 2.6v10.8"/>
        </svg>
      </button>
      <span class="title-text">Objects</span>
      <div class="value-cell">
        <button class="section-expand" data-section-expand aria-label="Свернуть/развернуть"><span class="chevron"></span></button>
      </div>
    </div>
    <div class="section-body"><div class="section-body-inner">
      <div class="row" data-field="Date">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="8" cy="8" r="5.5"/><path d="M8 4.7v3.6l2.4 1.5"/>
          </svg>
        </button>
        <div class="key">Date</div>
        <div class="value-cell">
          <input class="value" type="datetime-local" value="2026-09-04T15:11" data-value="date">
        </div>
      </div>

      <div class="row expandable" data-field="DOM">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="2.5" y="2.5" width="11" height="11" rx="1"/><path d="M5 5h6v6H5z"/>
          </svg>
        </button>
        <div class="key">DOM</div>
        <div class="value-cell">
          <button class="expand-btn" aria-label="Раскрыть DOM"><span class="chevron"></span></button>
        </div>
      </div>
      <div class="children"><div class="children-inner">
        <div class="child-row">
          <button class="type-menu-btn" data-type-menu><span class="mini-badge">ABC</span></button>
          <div class="key">nodeName</div>
          <div class="value-cell"><input class="value" value="DIV"></div>
        </div>
        <div class="child-row expandable" data-field="children">
          <button class="type-menu-btn" data-type-menu><span class="mini-badge">☷</span></button>
          <div class="key">children</div>
          <div class="value-cell">
            <button class="expand-btn" aria-label="Раскрыть children"><span class="chevron"></span></button>
          </div>
        </div>
        <div class="children l3"><div class="children-inner">
          <div class="child-row expandable" data-field="0">
            <button class="type-menu-btn" data-type-menu><span class="mini-badge">□</span></button>
            <div class="key">0</div>
            <div class="value-cell">
              <button class="expand-btn" aria-label="Раскрыть узел 0"><span class="chevron"></span></button>
            </div>
          </div>
          <div class="children l4"><div class="children-inner">
            <div class="child-row">
              <button class="type-menu-btn" data-type-menu><span class="mini-badge">ABC</span></button>
              <div class="key">nodeName</div>
              <div class="value-cell"><input class="value" value="SPAN"></div>
            </div>
            <div class="child-row expandable" data-field="attributes">
              <button class="type-menu-btn" data-type-menu><span class="mini-badge">▤</span></button>
              <div class="key">attributes</div>
              <div class="value-cell">
                <button class="expand-btn" aria-label="Раскрыть attributes"><span class="chevron"></span></button>
              </div>
            </div>
            <div class="children l5"><div class="children-inner">
              <div class="child-row">
                <button class="type-menu-btn" data-type-menu><span class="mini-badge">ABC</span></button>
                <div class="key">class</div>
                <div class="value-cell"><input class="value" value="label"></div>
              </div>
              <div class="child-row">
                <button class="type-menu-btn" data-type-menu><span class="mini-badge">ABC</span></button>
                <div class="key">id</div>
                <div class="value-cell"><input class="value" value=""></div>
              </div>
            </div></div>
          </div></div>
          <div class="child-row">
            <button class="type-menu-btn" data-type-menu><span class="mini-badge">ABC</span></button>
            <div class="key">1</div>
            <div class="value-cell"><input class="value" value="[Text node]" readonly></div>
          </div>
        </div></div>
      </div></div>

      <div class="row" data-field="XML">
        <button class="type-menu-btn" data-type-menu title="Тип и операции">XML</button>
        <div class="key">XML</div>
        <div class="value-cell">
          <div class="xml"><span class="tag">&lt;div</span>&nbsp;<span class="attr">xmlns</span>=<span class="str">"http://www.w3.org/1999/xhtml"</span>&nbsp;<span class="attr">class</span>=<span class="str">"bar"</span><span class="tag">&gt;hello&nbsp;</span><span class="pink">&lt;b&gt;world&lt;/b&gt;</span><span class="tag">&lt;/div&gt;</span></div>
        </div>
      </div>
    </div></div>
  </section>
</div>

<div class="menu" id="contextMenu">
  <div class="menu-title">Поле</div>
  <button class="menu-item" data-cmd="add"><span class="mi-icon">＋</span>Добавить поле</button>
  <button class="menu-item" data-cmd="duplicate"><span class="mi-icon">▣</span>Дублировать</button>
  <button class="menu-item" data-cmd="sort"><span class="mi-icon">↕</span>Сортировать</button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-cmd="type" id="typeMenuTrigger"><span class="mi-icon">◈</span>Сменить тип <span class="submenu-arrow">›</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item danger" data-cmd="delete"><span class="mi-icon">⌫</span>Удалить</button>
</div>

<div class="menu type-menu" id="typeMenu">
  <div class="menu-title">Сменить тип</div>
  <div class="type-grid">
    <button class="type-option" data-new-type="null"><span class="mi-icon">∅</span>Null</button>
    <button class="type-option" data-new-type="boolean"><span class="mi-icon">✓</span>Boolean</button>
    <button class="type-option" data-new-type="number"><span class="mi-icon">123</span>Number</button>
    <button class="type-option" data-new-type="string"><span class="mi-icon">ABC</span>String</button>
    <button class="type-option" data-new-type="date"><span class="mi-icon">◷</span>Date</button>
    <button class="type-option" data-new-type="object"><span class="mi-icon">□</span>Object</button>
    <button class="type-option" data-new-type="array"><span class="mi-icon">☷</span>Array</button>
    <button class="type-option" data-new-type="set"><span class="mi-icon">▦</span>Set</button>
    <button class="type-option" data-new-type="xml"><span class="mi-icon">XML</span>XML</button>
    <button class="type-option" data-new-type="dom"><span class="mi-icon">◇</span>DOM</button>
  </div>
</div>

<div class="menu" id="rootMenu">
  <div class="menu-title">Объект</div>
  <button class="menu-item" data-root-cmd="add"><span class="mi-icon">＋</span>Добавить свойство</button>
  <button class="menu-item" data-root-cmd="sort"><span class="mi-icon">↕</span>Сортировать свойства</button>
  <button class="menu-item" data-root-cmd="collapse"><span class="mi-icon">⌄</span>Свернуть всё</button>
  <button class="menu-item" data-root-cmd="expand"><span class="mi-icon">⌃</span>Раскрыть всё</button>
</div>

<div class="status">JS Object Editor · interactive prototype</div>

<script>
(() => {
  const state = {
    numbers: [123, 12],
    text: "foo",
    date: "2026-09-04 15:11",
    booleans: {trueValue:false, falseValue:true}
  };

  let activeField = null;

  const menus = [...document.querySelectorAll(".menu")];
  const closeMenus = () => menus.forEach(m => m.classList.remove("open"));

  const placeMenu = (menu, anchor) => {
    closeMenus();
    const r = anchor.getBoundingClientRect();
    menu.style.left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 8) + "px";
    menu.style.top = Math.min(r.bottom + 4, window.innerHeight - menu.offsetHeight - 8) + "px";
    menu.classList.add("open");
  };

  // "Сменить тип" opens as a hover submenu: the parent menu stays open,
  // only the submenu itself opens/closes as the pointer enters/leaves it.
  const typeMenuTrigger = document.getElementById("typeMenuTrigger");
  const typeMenuEl = document.getElementById("typeMenu");
  let typeMenuCloseTimer = null;

  const openTypeMenu = () => {
    clearTimeout(typeMenuCloseTimer);
    const r = typeMenuTrigger.getBoundingClientRect();
    typeMenuEl.style.left = Math.min(r.right - 4, window.innerWidth - typeMenuEl.offsetWidth - 8) + "px";
    typeMenuEl.style.top = Math.min(r.top, window.innerHeight - typeMenuEl.offsetHeight - 8) + "px";
    typeMenuEl.classList.add("open");
  };
  const scheduleTypeMenuClose = () => {
    clearTimeout(typeMenuCloseTimer);
    typeMenuCloseTimer = setTimeout(() => typeMenuEl.classList.remove("open"), 150);
  };

  typeMenuTrigger.addEventListener("mouseenter", openTypeMenu);
  typeMenuTrigger.addEventListener("mouseleave", scheduleTypeMenuClose);
  typeMenuEl.addEventListener("mouseenter", () => clearTimeout(typeMenuCloseTimer));
  typeMenuEl.addEventListener("mouseleave", scheduleTypeMenuClose);

  document.addEventListener("click", e => {
    const typeButton = e.target.closest("[data-type-menu]");
    if (typeButton) {
      e.stopPropagation();
      activeField = typeButton.closest(".row,.child-row");
      placeMenu(document.getElementById("contextMenu"), typeButton);
      return;
    }

    const sectionButton = e.target.closest("[data-section-menu]");
    if (sectionButton) {
      e.stopPropagation();
      activeField = sectionButton.closest(".section");
      placeMenu(document.getElementById("contextMenu"), sectionButton);
      return;
    }

    if (e.target.closest("[data-action='root-menu']")) {
      e.stopPropagation();
      placeMenu(document.getElementById("rootMenu"), e.target.closest("button"));
      return;
    }

    if (e.target.closest("#contextMenu [data-cmd='type']")) {
      // opened via hover (see openTypeMenu below); a click just keeps the submenu open
      return;
    }

    const cmd = e.target.closest("#contextMenu [data-cmd]");
    if (cmd) {
      handleCommand(cmd.dataset.cmd);
      closeMenus();
      return;
    }

    const newType = e.target.closest("[data-new-type]");
    if (newType) {
      changeType(newType.dataset.newType);
      closeMenus();
      return;
    }

    const rootCmd = e.target.closest("#rootMenu [data-root-cmd]");
    if (rootCmd) {
      if (rootCmd.dataset.rootCmd === "collapse") document.querySelectorAll(".expandable.expanded").forEach(x => x.classList.remove("expanded"));
      if (rootCmd.dataset.rootCmd === "expand") document.querySelectorAll(".expandable").forEach(x => x.classList.add("expanded"));
      closeMenus();
      return;
    }

    if (!e.target.closest(".menu")) closeMenus();
  });

  document.addEventListener("click", e => {
    const expand = e.target.closest(".expand-btn");
    if (!expand) return;
    const row = expand.closest(".expandable");
    if (row) row.classList.toggle("expanded");
  });

  document.addEventListener("click", e => {
    const toggle = e.target.closest("[data-section-expand]");
    if (!toggle) return;
    toggle.closest(".section")?.classList.toggle("collapsed");
  });

  document.addEventListener("click", e => {
    const nameEl = e.target.closest(".key,.title-text");
    if (!nameEl) return;
    const row = nameEl.closest(".row,.child-row,.section-title");
    if (!row) return;
    const input = row.querySelector(".value-cell input");
    if (input) {
      input.focus();
      input.select?.();
      return;
    }
    const bool = row.querySelector(".value-cell .bool-box");
    if (bool) {
      bool.click();
      return;
    }
    row.querySelector(".value-cell .expand-btn,.value-cell .section-expand")?.click();
  });

  document.addEventListener("click", e => {
    const stepBtn = e.target.closest(".stepper button");
    if (!stepBtn) return;
    const input = stepBtn.closest(".value-cell")?.querySelector("input.value");
    if (!input) return;
    const step = Number(stepBtn.dataset.step);
    input.value = String((parseFloat(input.value) || 0) + step);
    input.dispatchEvent(new Event("input", {bubbles: true}));
  });

  document.querySelectorAll("[data-bool]").forEach(box => {
    box.addEventListener("click", () => {
      box.classList.toggle("checked");
      state.booleans[box.dataset.bool] = box.classList.contains("checked");
    });
  });

  document.querySelectorAll("[data-value]").forEach(input => {
    input.addEventListener("input", e => {
      const p = e.target.dataset.value.split(".");
      if (p.length === 2) state[p[0]][Number(p[1])] = parseSmart(e.target.value);
      else state[p[0]] = parseSmart(e.target.value);
    });
  });

  function parseSmart(v){
    if (v === "") return "";
    if (/^-?(?:\d+\.?\d*|\.\d+)$/.test(v)) return Number(v);
    return v;
  }

  function handleCommand(cmd){
    if (cmd === "delete" && activeField && activeField.classList.contains("row")) {
      activeField.remove();
      return;
    }
    if (cmd === "duplicate" && activeField && activeField.parentElement) {
      const clone = activeField.cloneNode(true);
      clone.querySelectorAll("input").forEach(i => i.value = i.value);
      activeField.parentElement.insertBefore(clone, activeField.nextSibling);
      return;
    }
    if (cmd === "sort" && activeField && activeField.parentElement) {
      const rows = [...activeField.parentElement.querySelectorAll(":scope > .row,.child-row")];
      rows.sort((a,b) => (a.querySelector(".key")?.textContent || "").localeCompare(b.querySelector(".key")?.textContent || ""));
      rows.forEach(r => activeField.parentElement.appendChild(r));
      return;
    }
    if (cmd === "add") addField(activeField);
  }

  function addField(sectionOrRow){
    const section = sectionOrRow?.closest?.(".section") || document.querySelector(".section");
    const body = section.querySelector(".section-body");
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.field = "new";
    row.innerHTML = '<button class="type-menu-btn" data-type-menu title="Тип и операции">ABC</button><div class="key">new</div><div class="value-cell"><input class="value" value=""></div>';
    body.appendChild(row);
  }

  function changeType(type){
    if (!activeField || !activeField.classList.contains("row")) return;
    const btn = activeField.querySelector("[data-type-menu]");
    if (!btn) return;
    const labels = {null:"∅",boolean:"✓",number:"123",string:"ABC",date:"◷",object:"□",array:"☷",set:"▦",xml:"XML",dom:"◇"};
    btn.textContent = labels[type] || "ABC";
    const valueCell = activeField.querySelector(".value-cell");
    if (type === "object" || type === "array" || type === "set" || type === "dom" || type === "xml") {
      activeField.classList.add("expandable");
      if (valueCell && !valueCell.querySelector(".expand-btn")) {
        const ex = document.createElement("button");
        ex.className = "expand-btn";
        ex.innerHTML = '<span class="chevron"></span>';
        valueCell.appendChild(ex);
      }
    } else {
      activeField.classList.remove("expandable","expanded");
      valueCell?.querySelector(".expand-btn")?.remove();
    }
  }

  const toggleAllBtn = document.getElementById("toggleAllBtn");
  toggleAllBtn.addEventListener("click", () => {
    const opening = !toggleAllBtn.classList.contains("all-open");
    document.querySelectorAll(".section:not(.section-flat)").forEach(s => s.classList.toggle("collapsed", !opening));
    document.querySelectorAll(".expandable").forEach(r => r.classList.toggle("expanded", opening));
    toggleAllBtn.classList.toggle("all-open", opening);
  });

  window.addEventListener("resize", closeMenus);
  window.addEventListener("scroll", closeMenus, true);
})();
</script>
</body>
</html>
